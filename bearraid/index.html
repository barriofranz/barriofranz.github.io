<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bear Raid board</title>

	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	>
	<style>
		.cell-yellow {
			background-color: yellow !important;
			color: #111 !important;
		}

		.cell-orange {
			background-color: orange !important;
			color: #111 !important;
		}

		.cell-red {
			background-color: red !important;;
			color: #fff !important;
		}

		.cell-blue {
			background-color: blue !important;
			color: #fff !important;
		}

		.cell-purple {
			background-color: purple !important;
			color: #fff !important;
		}

		.cell-green {
			background-color: green !important;;
			color: #fff !important;
		}

        select#roundNumberSelect,
        select#roundSideSelect {
            border: 1px solid #000;
            min-height: 48px;
        }
		.showscrollbar {
			white-space: nowrap;
			-webkit-overflow-scrolling: touch;
		}

		#companyInput:focus,
		#qtyInput:focus {
			outline: 2px solid #000;
			outline-offset: 2px;
		}
		
		
		
		
		.scrollstyled .table {
			min-width: 160px;
		}
		.scrollstyled {
			overflow-x: scroll;
			width: 100%;
		}
		/* width */
		.scrollstyled::-webkit-scrollbar {
			width: 10px;
			height: 10px;
		}

		/* Track */
		.scrollstyled::-webkit-scrollbar-track {
			box-shadow: inset 0 0 2px #fff;
			border-radius: 10px;
		}
		/* Handle */
		.scrollstyled::-webkit-scrollbar-thumb {
			background: #7dc0c2;
			border-radius: 10px;
		}

		.summary-table {
			display: none;
		}
		.summary-table th {
			white-space: nowrap;
		}

		.nav-tabs {
			gap: 0.5rem;
			border: none;
			padding-bottom: 0.25rem;
			margin-bottom: 0;
		}
		.nav-tabs .nav-item {
			margin: 0;
		}
		.nav-tabs .nav-link {
			border: 1px solid rgba(0, 0, 0, 0.2);
			border-radius: 0.9rem 0.9rem 0.75rem 0.75rem;
			padding: 0.7rem 1.2rem;
			font-weight: 600;
			color: #1a1a1a;
			background: linear-gradient(180deg, #ffffff 0%, #f3f5f7 100%);
			transition: all 0.2s ease-in-out;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
			position: relative;
			overflow: visible;
		}
		.nav-tabs .nav-link:hover {
			transform: translateY(-1px);
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
		}
		.nav-tabs .nav-link.active {
			background: linear-gradient(180deg, #111111 0%, #000000 100%);
			color: #fff;
			border-color: #000;
			box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18);
		}
	</style>
</head>
<body>
	<div class="container py-4">
		

		<div class="row g-2 mb-3 mt-2">
			<div class="col-6 col-md-4">
				<select class="form-select form-select-sm" id="roundNumberSelect">
					<option value="1" selected>Round 1</option>
					<option value="2">Round 2</option>
					<option value="3">Round 3</option>
					<option value="4">Round 4</option>
					<option value="5">Round 5</option>
					<option value="6">Round 6</option>
					<option value="7">Round 7</option>
					<option value="8">Round 8</option>
					<option value="9">Round 9</option>
				</select>
			</div>
			<div class="col-6 col-md-3">
				<select class="form-select form-select-sm" id="roundSideSelect">
					<option value="a" selected>Turn A</option>
					<option value="b">Turn B</option>
				</select>
			</div>
		</div>

		<div class="table-responsive mt-5 mb-1">
			<ul class="nav nav-tabs" id="playerTabs" role="tablist"></ul>
		</div>

		<div class="tab-content mt-3" id="playerTabContent"></div>
		<div class="mt-5">
			<!-- <button type="button" class="btn btn-sm btn-outline-danger" id="clearSessionBtn">Clear Session</button> -->
		</div>


	</div>

	<script
		src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
		crossorigin="anonymous"
	></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"
	></script>
	<script>
		$(function () {
			var STORAGE_KEY = "bearRaidTransactions";
			var PLAYER_COUNT = 5;

			function getPlayerStorageKey(playerIndex) {
				return STORAGE_KEY + "_player_" + playerIndex;
			}

			function readTransactionsForPlayer(playerIndex) {
				var raw = sessionStorage.getItem(getPlayerStorageKey(playerIndex));
				if (!raw) {
					return [];
				}

				try {
					var parsed = JSON.parse(raw);
					return Array.isArray(parsed) ? parsed : [];
				} catch (e) {
					return [];
				}
			}

			function writeTransactionsForPlayer(playerIndex, transactions) {
				sessionStorage.setItem(getPlayerStorageKey(playerIndex), JSON.stringify(transactions));
			}

			function getNextTransactionId(transactions) {
				var maxId = transactions.reduce(function (max, tx) {
					var txId = parseInt(tx.id, 10);
					if (isNaN(txId)) {
						return max;
					}
					return Math.max(max, txId);
				}, 0);

				return maxId + 1;
			}

			function updateSummaryForPlayer(playerIndex, company, qty) {
				var ownedCell = $("#ownedRow-" + playerIndex + " td[data-company='" + company + "']");
				var shortedCell = $("#shortedRow-" + playerIndex + " td[data-company='" + company + "']");

				var ownedQty = parseFloat(ownedCell.text()) || 0;
				var shortedQty = parseFloat(shortedCell.text()) || 0;

				if (qty > 0) {
					var remainingToAdd = qty;

					if (shortedQty > 0) {
						var covered = Math.min(shortedQty, remainingToAdd);
						shortedQty -= covered;
						remainingToAdd -= covered;
					}

					if (remainingToAdd > 0) {
						ownedQty += remainingToAdd;
					}
				} else if (qty < 0) {
					var remainingToSubtract = Math.abs(qty);

					if (ownedQty > 0) {
						var deducted = Math.min(ownedQty, remainingToSubtract);
						ownedQty -= deducted;
						remainingToSubtract -= deducted;
					}

					if (remainingToSubtract > 0) {
						shortedQty += remainingToSubtract;
					}
				}

				ownedCell.text(ownedQty);
				shortedCell.text(shortedQty);
			}

			function resetSummaryForPlayer(playerIndex) {
				$("#ownedRow-" + playerIndex + " td[data-company], #shortedRow-" + playerIndex + " td[data-company]").text("0");
			}

			function renderTransactionsForPlayer(playerIndex, transactions) {
				var $dataRows = $("#player-tab-" + playerIndex + " .player-data-rows");
				$dataRows.find("tr").not(".entry-row").remove();

				transactions.forEach(function (tx, index) {
					var displayId = parseInt(tx.id, 10);
					if (isNaN(displayId)) {
						displayId = transactions.length - index;
					}
					var displayRound = tx.round || displayId;

					var rowHtml = "<tr>" +
						"<td class=\"company-cell\">" + tx.companyLabel + "</td>" +
						"<td>" + tx.qty + "</td>" +
						"<td>" + displayRound + "</td>" +
						"</tr>";

					var newRow = $(rowHtml);
					if (tx.companyColor) {
						newRow.find(".company-cell")
							.css("background-color", tx.companyColor)
							.addClass("cell-" + tx.companyColor);
					}

					$dataRows.append(newRow);
				});
			}

			function rebuildSummaryForPlayer(playerIndex, transactions) {
				resetSummaryForPlayer(playerIndex);
				transactions.forEach(function (tx) {
					updateSummaryForPlayer(playerIndex, tx.company, tx.qty);
				});
			}

			function buildPlayerTabContent(playerIndex) {
				var tabId = "player-tab-" + playerIndex;
				var isActive = playerIndex === 1 ? " show active" : "";

				return [
					'<div class="tab-pane fade' + isActive + '" id="' + tabId + '" role="tabpanel" data-player-index="' + playerIndex + '">',
					'<div class="table-responsive mt-3 scrollstyled">',
					'<table class="table table-bordered align-middle summary-table">',
					'<thead class="table-light">',
					'<tr>',
					'<th scope="col"></th>',
					'<th scope="col" class="cell-red">Edison</th>',
					'<th scope="col" class="cell-orange">Nile</th>',
					'<th scope="col" class="cell-green">Unusual Oil</th>',
					'<th scope="col" class="cell-yellow">Banana</th>',
					'<th scope="col" class="cell-blue">Gazillion</th>',
					'</tr>',
					'</thead>',
					'<tbody>',
					'<tr id="ownedRow-' + playerIndex + '">',
					'<th scope="row">Owned</th>',
					'<td data-company="edison">0</td>',
					'<td data-company="nile">0</td>',
					'<td data-company="unusual_oil">0</td>',
					'<td data-company="banana">0</td>',
					'<td data-company="gazillion">0</td>',
					'</tr>',
					'<tr id="shortedRow-' + playerIndex + '">',
					'<th scope="row">Shorted</th>',
					'<td data-company="edison">0</td>',
					'<td data-company="nile">0</td>',
					'<td data-company="unusual_oil">0</td>',
					'<td data-company="banana">0</td>',
					'<td data-company="gazillion">0</td>',
					'</tr>',
					'</tbody>',
					'</table>',
					'</div>',
					'<div class="table-responsive my-5 showscrollbar">',
					'<table class="table table-bordered table-striped align-middle mb-0 transaction-table">',
					'<thead class="table-light"><tr><th scope="col">Company</th><th scope="col">Quantity</th><th scope="col"></th></tr></thead>',
					'<tbody class="player-data-rows">',
					'<tr class="table-light entry-row">',
					'<td><select class="form-select form-select-sm company-input" id="companyInput-' + playerIndex + '">',
					'<option value="" selected></option>',
					'<option value="edison" data-color="red">Edison</option>',
					'<option value="nile" data-color="orange">Nile</option>',
					'<option value="unusual_oil" data-color="green">Unusual Oil</option>',
					'<option value="banana" data-color="yellow">Banana</option>',
					'<option value="gazillion" data-color="blue">Gazillion</option>',
					'</select></td>',
					'<td><input type="number" class="form-control form-control-sm qty-input" id="qtyInput-' + playerIndex + '" placeholder="Qty" step="1"></td>',
					'<td class="text-muted"><button type="button" class="btn btn-sm btn-primary w-100 add-row-btn" data-player-index="' + playerIndex + '">+</button></td>',
					'</tr>',
					'</tbody>',
					'</table>',
					'</div>',
					'</div>'
				].join('');
			}

			function buildPlayerTabs() {
				var $tabs = $("#playerTabs");
				var $content = $("#playerTabContent");

				$tabs.empty();
				$content.empty();

				for (var i = 1; i <= PLAYER_COUNT; i++) {
					var tabId = "player-tab-" + i;
					var $tabButton = $(
						'<li class="nav-item" role="presentation">' +
						'<button class="nav-link' + (i === 1 ? ' active' : '') + '" data-bs-toggle="tab" data-bs-target="#' + tabId + '" type="button" role="tab" aria-controls="' + tabId + '" aria-selected="' + (i === 1 ? 'true' : 'false') + '">Player ' + i + '</button>' +
						'</li>'
					);

					$tabs.append($tabButton);
					$content.append(buildPlayerTabContent(i));

					var transactions = readTransactionsForPlayer(i);
					renderTransactionsForPlayer(i, transactions);
				}
			}

			$("#playerTabContent").on("click", ".add-row-btn", function () {
				var playerIndex = parseInt($(this).data("playerIndex"), 10) || 1;
				var $pane = $("#player-tab-" + playerIndex);
				var selectedCompanyOption = $pane.find(".company-input option:selected");
				var selectedRound = $("#roundNumberSelect").val() + "-" + $("#roundSideSelect").val();
				var company = selectedCompanyOption.val() ? selectedCompanyOption.val().toString().trim() : "";
				var companyLabel = selectedCompanyOption.text().trim();
				var companyColor = selectedCompanyOption.data("color");
				var qty = parseFloat($pane.find("#qtyInput-" + playerIndex).val()) || 0;

				if (!company) {
					$pane.find(".company-input").trigger("focus");
					return;
				}

				if (qty === 0) {
					$pane.find(".qty-input").trigger("focus");
					return;
				}

				var transactions = readTransactionsForPlayer(playerIndex);
				var transactionId = getNextTransactionId(transactions);
				transactions.unshift({
					id: transactionId,
					round: selectedRound,
					company: company,
					companyLabel: companyLabel,
					companyColor: companyColor,
					qty: qty
				});
				writeTransactionsForPlayer(playerIndex, transactions);
				renderTransactionsForPlayer(playerIndex, transactions);
				rebuildSummaryForPlayer(playerIndex, transactions);

				$pane.find(".company-input").val("");
				$pane.find(".qty-input").val("");
				$pane.find(".company-input").trigger("focus");
			});

			$("#clearSessionBtn").on("click", function () {
				var shouldClear = window.confirm("Clear all session data? This cannot be undone for this tab session.");
				if (!shouldClear) {
					return;
				}

				sessionStorage.removeItem(STORAGE_KEY);
				for (var i = 1; i <= PLAYER_COUNT; i++) {
					sessionStorage.removeItem(getPlayerStorageKey(i));
					renderTransactionsForPlayer(i, []);
					rebuildSummaryForPlayer(i, []);
				}
			});

			buildPlayerTabs();
		});
	</script>
</body>
</html>
